# Builds the browser version with Godot's single-threaded web export (so no
# special server headers are needed) and publishes it to GitHub Pages.
# Pull requests only build, as a check; pushes to main also deploy.
name: Web build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Newer pushes to a PR replace older checks; deploys to Pages always finish.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Read access to the private art repo. Without it (for example in a
      # fork) the game is built with its simple shape models instead.
      ART_REPO_TOKEN: ${{ secrets.ART_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and web export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads

      # The full templates archive is ~1 GB, so only the web templates are kept.
      - name: Download Godot and web export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j /tmp/templates.tpz 'templates/web_nothreads_*' 'templates/version.txt' -d "$dest"
          rm /tmp/godot.zip /tmp/templates.tpz

      - name: Import project
        run: ~/godot/godot --headless --import

      # The paid models can't be shared as files, so they live in a private
      # repo and only reach players inside the exported game.
      - name: Check out the licensed art
        if: env.ART_REPO_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: AllisonEJohnson/madison-game-art
          token: ${{ env.ART_REPO_TOKEN }}
          path: itHappy
          persist-credentials: false

      # Keeps only the models the game uses (about 15 MB of 260 MB), then
      # imports them. The first import above made the class list it needs.
      - name: Drop unused art and import the rest
        if: env.ART_REPO_TOKEN != ''
        run: |
          ~/godot/godot --headless -s scripts/dev/prune_art.gd
          ~/godot/godot --headless --import

      - name: Export web build
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.pck

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
